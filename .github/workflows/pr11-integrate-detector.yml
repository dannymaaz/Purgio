name: "PR-11 Chrome model detector integration"

on:
  push:
    branches:
      - pr-11-chrome-on-device-model

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Align helper with current App indentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/pr11_integrate_detector.py')
          text = path.read_text()
          text = text.replace("start = app.find('            <Browsers\\n')", "start = app.find('          <Browsers\\n')")
          text = text.replace("end = app.find('            />', start)", "end = app.find('          />', start)")
          text = text.replace("end += len('            />')", "end += len('          />')")
          text = text.replace(
              "block = block.replace('            />', '              chromeOnDeviceModel={chromeOnDeviceModel}\\n            />')",
              "block = block.replace('          />', '            chromeOnDeviceModel={chromeOnDeviceModel}\\n          />')",
          )
          path.write_text(text)
          PY
      - name: Apply detector integration
        run: python3 scripts/pr11_integrate_detector.py
      - name: Format detector
        run: rustfmt --edition 2021 src-tauri/src/chrome_ai.rs
      - name: Commit product changes
        shell: bash
        run: |
          git config user.name "Danny Maaz"
          git config user.email "61290346+dannymaaz@users.noreply.github.com"
          git add src-tauri/src/chrome_ai.rs src-tauri/src/lib.rs src/App.tsx src/pages/Browsers.tsx src/i18n.tsx
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "Integrate Chrome model detector"
          git push origin HEAD:pr-11-chrome-on-device-model
