name: "PR-06 rustfmt persistence"

on:
  push:
    branches:
      - agent/pr-06-persisted-settings
    paths:
      - '.github/workflows/pr06-rustfmt.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-22.04
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          ref: agent/pr-06-persisted-settings

      - name: "Setup Rust"
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: "Format persistence module"
        run: |
          rustfmt --edition 2021 src-tauri/src/persistence.rs
          git rm .github/workflows/pr06-rustfmt.yml
          git config user.name "Danny Maaz"
          git config user.email "61290346+dannymaaz@users.noreply.github.com"
          git add src-tauri/src/persistence.rs
          git commit -m "Format persisted state module"
          git push origin HEAD:agent/pr-06-persisted-settings
