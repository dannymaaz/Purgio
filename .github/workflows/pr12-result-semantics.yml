name: "PR-12 Component Store result semantics"

on:
  push:
    branches:
      - pr-12-component-store-analyzer

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply result semantics fix
        run: python3 scripts/pr12_result_semantics.py
      - name: Format Rust
        run: rustfmt --edition 2021 src-tauri/src/component_store.rs
      - name: Commit product changes
        run: |
          git config user.name "Danny Maaz"
          git config user.email "61290346+dannymaaz@users.noreply.github.com"
          git add src-tauri/src/component_store.rs src/pages/ComponentStore.tsx src/i18n.tsx docs/PR-12.md
          git diff --cached --quiet && exit 0
          git commit -m "Clarify Component Store cleanup result semantics"
          git push origin HEAD:pr-12-component-store-analyzer
