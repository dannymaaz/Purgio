name: "PR-07 persistence schema migration"

on:
  push:
    branches:
      - pr-07-i18n
    paths:
      - '.github/workflows/pr07-persistence.yml'
      - 'scripts/pr07-persistence.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-22.04
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          ref: pr-07-i18n

      - name: "Setup Rust"
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: "Apply schema migration"
        run: |
          python scripts/pr07-persistence.py
          rustfmt --edition 2021 src-tauri/src/persistence.rs

      - name: "Commit migration"
        run: |
          git rm .github/workflows/pr07-persistence.yml scripts/pr07-persistence.py
          git config user.name "Danny Maaz"
          git config user.email "61290346+dannymaaz@users.noreply.github.com"
          git add src-tauri/src/persistence.rs
          git commit -m "Add system language preference schema migration"
          git push origin HEAD:pr-07-i18n
