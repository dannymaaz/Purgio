name: "PR-07 TypeScript fixes"

on:
  push:
    branches:
      - pr-07-i18n
    paths:
      - '.github/workflows/pr07-ts-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          ref: pr-07-i18n

      - name: "Apply TypeScript fixes"
        run: python scripts/pr07-ts-fix.py

      - name: "Commit TypeScript fixes"
        run: |
          git rm .github/workflows/pr07-ts-fix.yml scripts/pr07-ts-fix.py
          git config user.name "Danny Maaz"
          git config user.email "61290346+dannymaaz@users.noreply.github.com"
          git add src/App.tsx src/i18n.tsx
          git commit -m "Fix localization TypeScript integration"
          git push origin HEAD:pr-07-i18n
