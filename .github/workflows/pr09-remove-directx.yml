name: "PR-09 remove DirectX raw cleanup"

on:
  push:
    branches:
      - pr-09-windows-cleanup-safe

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Remove raw DirectX cleanup target
        run: python3 scripts/pr09_remove_directx.py
      - name: Format scanner
        run: rustfmt --edition 2021 src-tauri/src/scanner.rs
      - name: Commit product changes
        run: |
          git config user.name "Danny Maaz"
          git config user.email "61290346+dannymaaz@users.noreply.github.com"
          git add src-tauri/src/scanner.rs src/i18n.tsx
          git commit -m "Remove unsupported raw DirectX cache cleanup"
          git push origin HEAD:pr-09-windows-cleanup-safe
