name: "PR-10 browser cleanup hardening"

on:
  push:
    branches:
      - pr-10-browser-cleanup-safe

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply browser cleanup hardening
        run: python3 scripts/pr10_browser_hardening.py

      - name: Format scanner
        run: rustfmt --edition 2021 src-tauri/src/scanner.rs

      - name: Commit product changes
        shell: bash
        run: |
          git config user.name "Danny Maaz"
          git config user.email "61290346+dannymaaz@users.noreply.github.com"
          git add src-tauri/src/scanner.rs src/i18n.tsx
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "Harden browser cleanup scopes"
          git push origin HEAD:pr-10-browser-cleanup-safe
