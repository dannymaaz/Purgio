name: "PR-12 Component Store integration"

on:
  push:
    branches:
      - pr-12-component-store-analyzer

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run Component Store integration patch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply integration
        run: python3 scripts/pr12_integrate.py
      - name: Format Rust
        run: rustfmt --edition 2021 src-tauri/src/component_store.rs
      - name: Commit product changes
        run: |
          git config user.name "Danny Maaz"
          git config user.email "61290346+dannymaaz@users.noreply.github.com"
          git add src-tauri/src/lib.rs src/pages/Cleaner.tsx src/i18n.tsx .github/workflows/ci.yml src-tauri/src/component_store.rs
          git commit -m "Integrate Component Store analyzer"
          git push origin HEAD:pr-12-component-store-analyzer
