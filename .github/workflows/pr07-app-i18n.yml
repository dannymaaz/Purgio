name: "PR-07 App i18n wiring"

on:
  push:
    branches:
      - pr-07-i18n
    paths:
      - '.github/workflows/pr07-app-i18n.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          ref: pr-07-i18n

      - name: "Apply App i18n wiring"
        run: python scripts/pr07-app-i18n.py

      - name: "Commit App i18n wiring"
        run: |
          git rm .github/workflows/pr07-app-i18n.yml scripts/pr07-app-i18n.py
          git config user.name "Danny Maaz"
          git config user.email "61290346+dannymaaz@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Wire system locale and active language into the app"
          git push origin HEAD:pr-07-i18n
