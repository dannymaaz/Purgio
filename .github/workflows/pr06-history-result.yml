name: "PR-06 history result patch"

on:
  push:
    branches:
      - agent/pr-06-persisted-settings
    paths:
      - '.github/workflows/pr06-history-result.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          ref: agent/pr-06-persisted-settings

      - name: "Apply patch"
        run: node scripts/pr06-history-result.mjs

      - name: "Commit patch"
        run: |
          git rm .github/workflows/pr06-history-result.yml scripts/pr06-history-result.mjs
          git config user.name "Danny Maaz"
          git config user.email "61290346+dannymaaz@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Keep cleanup result independent from history persistence"
          git push origin HEAD:agent/pr-06-persisted-settings
