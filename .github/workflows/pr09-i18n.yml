name: "PR-09 backend localization"

on:
  push:
    branches:
      - pr-09-windows-cleanup-safe

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply backend metadata translations
        run: python3 scripts/pr09_i18n.py
      - name: Commit localization
        run: |
          git config user.name "Danny Maaz"
          git config user.email "61290346+dannymaaz@users.noreply.github.com"
          git add src/i18n.tsx
          git commit -m "Localize hardened Windows cleanup metadata"
          git push origin HEAD:pr-09-windows-cleanup-safe
