name: "PR-09 application crash dump hardening"

on:
  push:
    branches:
      - pr-09-windows-cleanup-safe

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Harden application crash dump scope
        run: python3 scripts/pr09_wer_scope.py
      - name: Commit product changes
        run: |
          git config user.name "Danny Maaz"
          git config user.email "61290346+dannymaaz@users.noreply.github.com"
          git add src-tauri/src/scanner.rs src/i18n.tsx
          git commit -m "Harden application crash dump cleanup scope"
          git push origin HEAD:pr-09-windows-cleanup-safe
