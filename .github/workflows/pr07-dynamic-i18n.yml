name: "PR-07 dynamic localization"

on:
  push:
    branches:
      - pr-07-i18n
    paths:
      - '.github/workflows/pr07-dynamic-i18n.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          ref: pr-07-i18n

      - name: "Apply dynamic localization"
        run: python scripts/pr07-dynamic-i18n.py

      - name: "Commit localization"
        run: |
          git rm .github/workflows/pr07-dynamic-i18n.yml scripts/pr07-dynamic-i18n.py
          git config user.name "Danny Maaz"
          git config user.email "61290346+dannymaaz@users.noreply.github.com"
          git add src/App.tsx src/i18n.tsx
          git commit -m "Localize dynamic dialogs and centralize locale resolution"
          git push origin HEAD:pr-07-i18n
