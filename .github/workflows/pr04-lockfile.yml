name: "PR-04 Cargo lock sync"

on:
  push:
    branches:
      - agent/pr-04-tauri-updater
    paths:
      - '.github/workflows/pr04-lockfile.yml'

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-22.04
    steps:
      - name: "Checkout PR branch"
        uses: actions/checkout@v7
        with:
          ref: agent/pr-04-tauri-updater

      - name: "Setup Rust"
        uses: dtolnay/rust-toolchain@stable

      - name: "Resolve manifest against existing lockfile"
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 > /dev/null

      - name: "Commit lockfile and remove one-off workflow"
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr04-lockfile.yml
          git add src-tauri/Cargo.lock
          git diff --cached --quiet && exit 1
          git commit -m "Lock Tauri updater dependency"
          git push origin HEAD:agent/pr-04-tauri-updater
