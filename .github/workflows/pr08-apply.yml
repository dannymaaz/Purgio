name: "PR-08 cleanup plan integration"

on:
  push:
    branches:
      - pr-08-cleanup-plan

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply UI integration
        run: python3 scripts/pr08_apply.py
      - name: Remove temporary helpers
        run: git rm .github/workflows/pr08-apply.yml scripts/pr08_apply.py
      - name: Commit integration
        run: |
          git config user.name "Danny Maaz"
          git config user.email "61290346+dannymaaz@users.noreply.github.com"
          git add -A
          git commit -m "Integrate backend-verified cleanup plan UI"
          git push origin HEAD:pr-08-cleanup-plan
