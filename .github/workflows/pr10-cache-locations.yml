name: "PR-10 cache location alignment"

on:
  push:
    branches:
      - pr-10-browser-cleanup-safe

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Align cache and download discovery
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src-tauri/src/scanner.rs')
          text = path.read_text()

          fn_start = text.index('fn get_browser_paths()')
          linux_start = text.index('    #[cfg(target_os = "linux")]\n', fn_start)
          linux_end = text.index('\n    paths\n}', linux_start)
          linux_block = r'''    #[cfg(target_os = "linux")]
              {
                  if let Ok(home) = env::var("HOME") {
                      let home_path = PathBuf::from(&home);
                      let system_config = env::var("XDG_CONFIG_HOME")
                          .map(PathBuf::from)
                          .unwrap_or_else(|_| home_path.join(".config"));
                      let chrome_config = env::var("CHROME_CONFIG_HOME")
                          .map(PathBuf::from)
                          .unwrap_or_else(|_| system_config.clone());

                      paths.push(("Chrome".to_string(), chrome_config.join("google-chrome")));
                      paths.push((
                          "Brave".to_string(),
                          system_config.join("BraveSoftware/Brave-Browser"),
                      ));
                      paths.push(("Opera".to_string(), system_config.join("opera")));

                      let legacy_firefox = home_path.join(".mozilla/firefox");
                      let xdg_firefox = system_config.join("mozilla/firefox");
                      paths.push((
                          "Firefox".to_string(),
                          if legacy_firefox.exists() {
                              legacy_firefox
                          } else {
                              xdg_firefox
                          },
                      ));
                      paths.push(("Chromium".to_string(), chrome_config.join("chromium")));
                  }
              }
          '''
          text = text[:linux_start] + linux_block + text[linux_end:]

          incomplete_start = text.index('fn is_incomplete_browser_download(')
          incomplete_end = text.index('\nfn is_browser_crash_report_file', incomplete_start)
          text = text[:incomplete_start] + text[incomplete_end + 1:]

          discover_end_marker = '    profiles\n}\n\nfn is_browser_crash_report_file'
          if discover_end_marker not in text:
              raise SystemExit('Missing profile-discovery insertion marker')
          cache_helper = r'''    profiles
          }

          fn browser_cache_profile_dir(name: &str, profile: &Path) -> PathBuf {
              if name == "Firefox" {
                  let profile_name = match profile.file_name() {
                      Some(profile_name) => profile_name,
                      None => return profile.to_path_buf(),
                  };

                  #[cfg(target_os = "windows")]
                  {
                      if let Ok(local_appdata) = env::var("LOCALAPPDATA") {
                          return PathBuf::from(local_appdata)
                              .join("Mozilla\\Firefox\\Profiles")
                              .join(profile_name);
                      }
                  }

                  #[cfg(target_os = "macos")]
                  {
                      if let Ok(home) = env::var("HOME") {
                          return PathBuf::from(home)
                              .join("Library/Caches/Firefox/Profiles")
                              .join(profile_name);
                      }
                  }

                  #[cfg(target_os = "linux")]
                  {
                      if let Ok(home) = env::var("HOME") {
                          let cache_root = env::var("XDG_CACHE_HOME")
                              .map(PathBuf::from)
                              .unwrap_or_else(|_| PathBuf::from(home).join(".cache"));
                          return cache_root.join("mozilla/firefox").join(profile_name);
                      }
                  }
              }

              #[cfg(target_os = "macos")]
              {
                  if let Ok(home) = env::var("HOME") {
                      let home_path = PathBuf::from(home);
                      let app_support = home_path.join("Library/Application Support");
                      if let Ok(relative) = profile.strip_prefix(&app_support) {
                          return home_path.join("Library/Caches").join(relative);
                      }
                  }
              }

              #[cfg(target_os = "linux")]
              {
                  if let Ok(home) = env::var("HOME") {
                      let home_path = PathBuf::from(home);
                      let system_config = env::var("XDG_CONFIG_HOME")
                          .map(PathBuf::from)
                          .unwrap_or_else(|_| home_path.join(".config"));
                      let system_cache = env::var("XDG_CACHE_HOME")
                          .map(PathBuf::from)
                          .unwrap_or_else(|_| home_path.join(".cache"));
                      if let Ok(relative) = profile.strip_prefix(&system_config) {
                          return system_cache.join(relative);
                      }
                  }
              }

              profile.to_path_buf()
          }

          fn is_browser_crash_report_file'''
          text = text.replace(discover_end_marker, cache_helper, 1)

          old_cache_collect = '''            for profile in &profiles {
                          collect_browser_path(&profile.join(relative_dir), &mut paths, &mut size);
                      }
          '''
          new_cache_collect = '''            for profile in &profiles {
                          let cache_profile = browser_cache_profile_dir(&name, profile);
                          collect_browser_path(&cache_profile.join(relative_dir), &mut paths, &mut size);
                      }
          '''
          if old_cache_collect not in text:
              raise SystemExit('Missing cache collection block')
          text = text.replace(old_cache_collect, new_cache_collect, 1)

          download_start = text.index('        // 3. Descargas incompletas:')
          crash_start = text.index('        // 4. Reportes de fallos', download_start)
          text = text[:download_start] + '''        // Descargas incompletas no se emiten en PR-10. Chromium crea .crdownload junto al\n        // target real y Firefox usa .part en el destino de descarga; ese destino puede ser\n        // personalizado. Purgio no adivina ni recorre Downloads como sustituto del estado\n        // real del navegador.\n\n''' + text[crash_start:]

          old_test = '''    #[test]
              fn incomplete_download_filter_is_extension_scoped() {
                  assert!(is_incomplete_browser_download("video.crdownload", "Chrome"));
                  assert!(is_incomplete_browser_download("archive.PART", "Firefox"));
                  assert!(!is_incomplete_browser_download("video.mp4", "Chrome"));
                  assert!(!is_incomplete_browser_download("File System", "Chrome"));
                  assert!(!is_incomplete_browser_download("download.part", "Safari"));
              }

          '''
          if old_test not in text:
              raise SystemExit('Missing incomplete-download test')
          text = text.replace(old_test, '', 1)

          path.write_text(text)

          i18n_path = Path('src/i18n.tsx')
          i18n = i18n_path.read_text()
          old_rules = '''  const dynamicRules: Array<[RegExp, (match: RegExpMatchArray) => string]> = [
              [/^Caché de (.+)$/, (m) => `${m[1]} Cache`],
              [/^Caché HTTP de (.+)$/, (m) => `${m[1]} HTTP Cache`],
            [/^Caché de Código de (.+)$/, (m) => `${m[1]} Code Cache`],
            [/^Caché GPU de (.+)$/, (m) => `${m[1]} GPU Cache`],
            [/^Reportes de fallos de (.+)$/, (m) => `${m[1]} Crash Reports`],
          '''
          new_rules = '''  const dynamicRules: Array<[RegExp, (match: RegExpMatchArray) => string]> = [
              [/^Caché HTTP de (.+)$/, (m) => `${m[1]} HTTP Cache`],
              [/^Caché de Código de (.+)$/, (m) => `${m[1]} Code Cache`],
              [/^Caché GPU de (.+)$/, (m) => `${m[1]} GPU Cache`],
              [/^Reportes de fallos de (.+)$/, (m) => `${m[1]} Crash Reports`],
              [/^Caché de (.+)$/, (m) => `${m[1]} Cache`],
          '''
          if old_rules not in i18n:
              raise SystemExit('Missing PR-10 dynamic-rule block')
          i18n = i18n.replace(old_rules, new_rules, 1)
          i18n_path.write_text(i18n)
          PY
      - name: Format scanner
        run: rustfmt --edition 2021 src-tauri/src/scanner.rs
      - name: Commit product changes
        shell: bash
        run: |
          git config user.name "Danny Maaz"
          git config user.email "61290346+dannymaaz@users.noreply.github.com"
          git add src-tauri/src/scanner.rs src/i18n.tsx
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "Align browser cache locations"
          git push origin HEAD:pr-10-browser-cleanup-safe
