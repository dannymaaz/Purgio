name: "PR-07 App text localization"

on:
  push:
    branches:
      - pr-07-i18n
    paths:
      - '.github/workflows/pr07-app-text.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          ref: pr-07-i18n

      - name: "Apply App text localization"
        run: python scripts/pr07-app-text.py

      - name: "Commit App text localization"
        run: |
          git rm .github/workflows/pr07-app-text.yml scripts/pr07-app-text.py
          git config user.name "Danny Maaz"
          git config user.email "61290346+dannymaaz@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Localize application dialogs and notifications"
          git push origin HEAD:pr-07-i18n
