name: "CI"

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: "Frontend build"
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: "Install dependencies"
        run: npm ci

      - name: "Build frontend"
        run: npm run build

  rust-windows:
    name: "Rust checks (Windows)"
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Setup Rust"
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: "Check PR Rust formatting"
        shell: bash
        run: |
          rustfmt --edition 2021 --check src-tauri/src/cleaner.rs src-tauri/src/safety.rs
          rustfmt --edition 2021 --config skip_children=true --check src-tauri/src/lib.rs

      - name: "Run tests"
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: "Run Clippy"
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features
