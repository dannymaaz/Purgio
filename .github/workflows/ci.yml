name: "CI"

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
      - 'agent/**'
      - 'pr-*'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: "Frontend quality"
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Setup Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: "Install dependencies"
        run: npm ci

      - name: "Audit production dependencies"
        run: npm audit --omit=dev --audit-level=high

      - name: "Check localization coverage"
        run: node scripts/check-i18n.mjs

      - name: "Build frontend"
        run: npm run build

  rust-windows:
    name: "Rust strict checks (Windows)"
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Setup Rust"
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: "Check security, scanner, cleanup and persistence formatting"
        run: rustfmt --edition 2021 --check src-tauri/src/scanner.rs src-tauri/src/cleaner.rs src-tauri/src/safety.rs src-tauri/src/persistence.rs

      - name: "Run tests"
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: "Run strict Clippy"
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

  windows-package:
    name: "Windows NSIS package"
    runs-on: windows-latest
    needs:
      - frontend
      - rust-windows
    timeout-minutes: 30

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Setup Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: "Setup Rust"
        uses: dtolnay/rust-toolchain@stable

      - name: "Install dependencies"
        run: npm ci

      - name: "Verify NSIS branding assets"
        shell: pwsh
        run: |
          $assets = @{
            "src-tauri/windows/nsis/header.bmp" = @(150, 57)
            "src-tauri/windows/nsis/sidebar.bmp" = @(164, 314)
          }
          foreach ($entry in $assets.GetEnumerator()) {
            if (-not (Test-Path $entry.Key)) {
              throw "Missing NSIS branding asset: $($entry.Key)"
            }
            $bytes = [System.IO.File]::ReadAllBytes($entry.Key)
            if ($bytes.Length -lt 26 -or $bytes[0] -ne 0x42 -or $bytes[1] -ne 0x4D) {
              throw "Invalid BMP asset: $($entry.Key)"
            }
            $width = [BitConverter]::ToInt32($bytes, 18)
            $height = [BitConverter]::ToInt32($bytes, 22)
            if ($width -ne $entry.Value[0] -or $height -ne $entry.Value[1]) {
              throw "Unexpected dimensions for $($entry.Key): ${width}x${height}"
            }
          }

      - name: "Build NSIS installer"
        run: npm run tauri -- build --bundles nsis

      - name: "Verify NSIS installer output"
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" -ErrorAction SilentlyContinue)
          if ($installers.Count -eq 0) {
            throw "NSIS build completed without producing a *-setup.exe installer."
          }
          foreach ($installer in $installers) {
            if ($installer.Length -lt 1MB) {
              throw "Installer output is unexpectedly small: $($installer.FullName)"
            }
            Write-Host "Verified installer: $($installer.Name) ($([math]::Round($installer.Length / 1MB, 2)) MB)"
          }
