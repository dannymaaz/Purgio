name: "PR-11 localization syntax fix"

on:
  push:
    branches:
      - pr-11-chrome-on-device-model

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fix apostrophe in Chrome model message
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/i18n.tsx')
          text = path.read_text()
          old = "  'No se detectó una instalación verificable del modelo local administrado por Chrome.': 'No verifiable installation of Chrome's managed local model was detected.',\n"
          new = "  'No se detectó una instalación verificable del modelo local administrado por Chrome.': \"No verifiable installation of Chrome's managed local model was detected.\",\n"
          if old not in text:
              raise SystemExit('Expected malformed localization line not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit product fix
        shell: bash
        run: |
          git config user.name "Danny Maaz"
          git config user.email "61290346+dannymaaz@users.noreply.github.com"
          git add src/i18n.tsx
          git commit -m "Fix Chrome model localization syntax"
          git push origin HEAD:pr-11-chrome-on-device-model
