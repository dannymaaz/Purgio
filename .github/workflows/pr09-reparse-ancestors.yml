name: "PR-09 reparse ancestor hardening"

on:
  push:
    branches:
      - pr-09-windows-cleanup-safe

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Harden scanner against reparse ancestors
        run: python3 scripts/pr09_reparse_ancestors.py
      - name: Format Rust changes
        run: rustfmt --edition 2021 src-tauri/src/scanner.rs src-tauri/src/safety.rs
      - name: Commit product changes
        run: |
          git config user.name "Danny Maaz"
          git config user.email "61290346+dannymaaz@users.noreply.github.com"
          git add src-tauri/src/scanner.rs src-tauri/src/safety.rs
          git commit -m "Block cleanup through Windows reparse ancestors"
          git push origin HEAD:pr-09-windows-cleanup-safe
