name: "PR-07 Clippy migration test fix"

on:
  push:
    branches:
      - pr-07-i18n
    paths:
      - '.github/workflows/pr07-clippy-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          ref: pr-07-i18n

      - name: "Setup Rust"
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: "Apply Clippy fix"
        run: |
          python scripts/pr07-clippy-fix.py
          rustfmt --edition 2021 src-tauri/src/persistence.rs

      - name: "Commit fix"
        run: |
          git rm .github/workflows/pr07-clippy-fix.yml scripts/pr07-clippy-fix.py
          git config user.name "Danny Maaz"
          git config user.email "61290346+dannymaaz@users.noreply.github.com"
          git add src-tauri/src/persistence.rs
          git commit -m "Fix strict Clippy finding in locale migration test"
          git push origin HEAD:pr-07-i18n
