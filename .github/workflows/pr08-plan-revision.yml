name: "PR-08 plan revision guard"

on:
  push:
    branches:
      - pr-08-cleanup-plan

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply plan revision guard
        run: python3 scripts/pr08_plan_revision.py
      - name: Commit product changes
        run: |
          git config user.name "Danny Maaz"
          git config user.email "61290346+dannymaaz@users.noreply.github.com"
          git add src/App.tsx src/i18n.tsx
          git commit -m "Reject cleanup when reviewed plan scope changes"
          git push origin HEAD:pr-08-cleanup-plan
